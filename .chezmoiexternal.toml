[".tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm.git"
refreshPeriod = "168h"

# zsh plugins, sourced by ~/.zshrc. Git checkouts keep both machines on the
# same versions without Homebrew or pacman.
[".local/share/zsh/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

# Richer than zsh-syntax-highlighting: per-command chroma (git, ssh, make,
# grep…), variables inside strings, brackets by depth, math and for-loops.
[".local/share/zsh/plugins/fast-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]
