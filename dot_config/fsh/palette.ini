; fast-syntax-highlighting theme for both machines. Every colour is one of
; the 16 terminal colours (names, or 8-15 for the bright variants), never a
; 256-colour or hex value, so highlighting follows the terminal theme: the
; active Omarchy theme on the desktop, kitty's own theme on the Mac.
; ~/.zshrc recompiles it with `fast-theme XDG:palette` whenever it changes.

[base]
default          = none
unknown-token    = red,bold
commandseparator = 8
redirection      = magenta
here-string-tri  = yellow
here-string-text = 14
here-string-var  = cyan
exec-descriptor  = yellow,bold
comment          = 8
correct-subtle   = 12
incorrect-subtle = red
subtle-separator = green
subtle-bg        = bg:8
secondary        = free

[command-point]
reserved-word     = magenta,bold
subcommand        = cyan
alias             = 10
suffix-alias      = 10
global-alias      = bg:blue
builtin           = blue,bold
function          = 12
command           = green
precommand        = green,underline
hashed-command    = green
single-sq-bracket = magenta
double-sq-bracket = magenta
double-paren      = magenta

[paths]
path          = underline
pathseparator = 8
path-to-dir   = blue,underline
globbing      = yellow,bold
globbing-ext  = 11

[brackets]
paired-bracket  = bg:8
bracket-level-1 = blue,bold
bracket-level-2 = magenta,bold
bracket-level-3 = cyan,bold

[arguments]
single-hyphen-option   = yellow
double-hyphen-option   = yellow
back-quoted-argument   = magenta
single-quoted-argument = green
double-quoted-argument = green
dollar-quoted-argument = green

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = cyan
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = cyan

[other]
variable             = 13
assign               = none
assign-array-bracket = magenta
history-expansion    = blue,bold

[math]
mathvar = blue,bold
mathnum = 11
matherr = red

[for-loop]
forvar  = 13
fornum  = 11
foroper = yellow
forsep  = yellow,bold

[case]
case-input       = green
case-parentheses = yellow
case-condition   = bg:8
